<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Assistente Uma Receita</title>
    <link rel="stylesheet" href="../src/recipe-assistant.css" />
  </head>
  <body>
    <div id="uma-receita-assistant"></div>

    <script src="../src/recipe-assistant.js"></script>
    <script>
      new UmaReceitaAssistantWidget({
        mount: '#uma-receita-assistant',
        siteUrl: 'https://umareceita.pt',
        wprmEndpoint: 'https://umareceita.pt/wp-json/wp/v2/wprm_recipe?per_page=100&_embed'
      }).init();
    </script>
  </body>
</html>
